<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>RIOTVERSE</title>
    <script>
      // GitHub Pages SPA fallback (based on rafgraph/spa-github-pages, MIT).
      // GitHub Pages returns this file for unknown paths such as /RIOTVERSE/champions/Ahri.
      // It rewrites the path into a query string and redirects to index.html,
      // where a small script in index.html restores the original URL for React Router.
      // pathSegmentsToKeep = 1 keeps the "/RIOTVERSE" repository segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
